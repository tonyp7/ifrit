[project]
name = "ifrit-backend"
version = "1.1.1"
description = "Ifrit backend — FastAPI REST API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "argon2-cffi>=25.1.0",
    "fpdf2>=2.8.8",
    "pandas>=3.0.6",
    "openpyxl>=3.1.5",
    "slowapi>=0.1.10",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "python-magic>=0.4.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
# Test functions take pytest/pytest-asyncio fixtures as params; requiring type
# annotations on every one of them is boilerplate without real payoff.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
