[project]
name = "ifrit-backend"
version = "2.0.0"
description = "Ifrit backend — FastAPI REST API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "argon2-cffi>=25.1.0",
    "fpdf2>=2.8.8",
    "pandas>=3.0.6",
    "openpyxl>=3.1.5",
    "slowapi>=0.1.10",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "python-magic>=0.4.27",
    "pypdf>=6.21.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "pyrefly>=1.3.2",
    "pandas-stubs>=3.0.5.260914",
    "types-openpyxl>=3.1.5.20260827",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "libreoffice: renders a PDF with the real LibreOffice, and is skipped when it is not installed",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyrefly]
python-version = "3.14"
# What `uv run pyrefly check` looks at. Migrations and one-off scripts are not type-checked.
project-includes = ["app", "tests"]
# The strict preset is the nearest thing to mypy's `strict = true`: the default error kinds plus
# `implicit-any`, `unused-ignore` and the like.
preset = "strict"
# asyncpg ships no stubs.
ignore-missing-imports = ["asyncpg.*"]
check-unannotated-defs = true

[tool.pyrefly.errors]
# What mypy's `strict = true` enforces, as the converter mapped it.
unannotated-return = "error"
no-any-return = "error"
implicit-any-parameter = "error"
implicit-any = "error"
redundant-cast = "warn"
# Not something mypy's strict mode asked for, and every override in a model hierarchy would need it.
missing-override-decorator = false

# Test functions take pytest/pytest-asyncio fixtures as params; requiring type annotations on
# every one of them is boilerplate without real payoff.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-parameter = false
unannotated-return = false
# The same fixtures are untyped, so what they return is implicit `Any`.
no-any-return-implicit = false
