# Builds the combined app image (docker/Dockerfile) and publishes it to GHCR.
#
# - Push to main (merged PR or direct commit): build and push `latest` + `sha-<7>`.
# - Push of a v*.*.* tag (release): do NOT rebuild. Add the semver tags to the image
#   already built from that commit ("build once, promote"), so the released image is
#   byte-for-byte the one that ran from main. Tag a commit only after its main build
#   is green, otherwise the promote job fails (no sha-<7> image to promote).
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Never run two publishes at once, and let a newer commit supersede a queued one
# without cancelling a push that is already in flight.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ifrit
          tags: |
            type=raw,value=latest
            type=sha

      # Build context is the REPO ROOT (backend/ and frontend/ must both be in it),
      # matching docker/build.sh.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Release: re-tag the existing image instead of rebuilding. `imagetools create`
  # copies the manifest (same digest, attestations preserved) under the new tags.
  promote:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only computes the semver tags (v1.2.3 -> 1.2.3, 1.2, 1); nothing is built here.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ifrit
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Fails if sha-<7> was never pushed (tagged commit not built from main yet).
      - name: Add semver tags to the existing image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "ghcr.io/${OWNER,,}/ifrit:sha-${GITHUB_SHA::7}"
