# Runs the test suites, linters and the production build on every pull request (Dependabot's
# included) and on pushes to main. Secret-free on purpose, and no job that runs a pull request's
# code has a write token: it uses `pull_request`, never `pull_request_target`, so code from a PR
# never runs with elevated rights. The one job that can write, `coverage-main`, runs only on
# pushes to main, so only on code that was already merged. The coverage comment on a pull request
# is posted by a separate workflow, coverage-comment.yml, which never checks out code.
#
# The backend job fails on code `ruff format` would change (fix: `uv run ruff format .` in
# backend/), and the frontend job on code Prettier would change (fix: `pnpm format` in frontend/).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Publishes nothing, so a superseded run can simply be cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ifrit
          POSTGRES_PASSWORD: ifrit
          POSTGRES_DB: ifrit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ifrit -d ifrit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The tests create and use one database per pytest-xdist worker next to this one
    # (`ifrit_test_gw0`, `ifrit_test_gw1`, ...). None of these is a secret.
    # The JWT key must be at least 64 bytes: shorter ones make PyJWT warn on every token (HS512 test).
    env:
      DATABASE_URL: postgresql+asyncpg://ifrit:ifrit@localhost:5432/ifrit
      JWT_SECRET_KEY: ci-only-insecure-secret-key-0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
      CORS_ORIGINS: '["http://localhost:5173"]'
      COOKIE_SECURE: "false"
      SEED_ADMIN_EMAIL: admin@ifrit.local
      SEED_ADMIN_PASSWORD: changeme123
      STORAGE_ROOT: /tmp/ifrit-storage
      MAX_UPLOAD_BYTES: "10485760"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Shared library behind python-magic, which sniffs an upload's real content type.
      # LibreOffice Writer (and the Liberation fonts it lays text out in) for the tests that
      # render an invoice PDF; they skip themselves when it is missing. poppler-utils gives them
      # pdftotext, to read where the text lands on the page; they skip without it too, which is
      # silent, so check the skipped count in the log when changing this line. fonts-noto-cjk is
      # the CJK fallback the report PDF tests look for; they skip without it too.
      # Installed without recommends, as the Dockerfile does: the recommended packages (GUI
      # libraries, language packs, help) were most of the install and nothing here uses them.
      # libreoffice-java-common mirrors the image's package set.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1 libreoffice-writer libreoffice-java-common fonts-liberation fonts-noto-cjk poppler-utils
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # Without this uv uses whatever Python the runner image ships. Keep it in step with
          # `requires-python` in backend/pyproject.toml and the FROM lines in docker/Dockerfile.
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # --locked fails if pyproject.toml and uv.lock disagree (e.g. a half-applied bump).
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyrefly check
      # One worker per vCPU; each builds its schema once and empties it after every test. The
      # slowest tests are listed at the end of the log. `--cov` measures the `app` package
      # (settings in pyproject.toml) and the workers' data is combined into backend/.coverage.
      - run: uv run pytest -q -n auto --durations=15 --cov --cov-report=term:skip-covered
      # The coverage jobs below read this file. It is hidden, which the upload action skips
      # unless told otherwise, and a missing file must fail the run, not pass it without coverage.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-data
          path: backend/.coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Turns the backend job's coverage data into a comment for the pull request and a job summary.
  # It holds only the top-level read token, so it cannot write to the repository or to the pull
  # request: it writes the comment text to an artifact, and coverage-comment.yml (a separate
  # workflow that never checks out code) posts it. That is also what makes it work for Dependabot
  # and fork pull requests, whose tokens are read-only.
  coverage-pr:
    if: github.event_name == 'pull_request'
    needs: backend
    runs-on: ubuntu-latest
    steps:
      # The action reads the sources to count statements and to see which lines the PR changed.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage-data
          path: backend
      # Pinned by commit SHA rather than a tag: it is the one third-party action here that is
      # given a write token (in coverage-main and coverage-comment.yml).
      - id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          # The tests run in backend/, so that is the folder the paths in .coverage are relative to.
          COVERAGE_PATH: backend
          # Badge colours only; nothing fails on a low figure.
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 75
      - uses: actions/upload-artifact@v7
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

  # Saves the coverage data, badge and HTML report of main on the branch
  # python-coverage-comment-action-data, which the action creates on its first run and which the
  # README badge and later pull request comparisons read. It is the only job with a write token
  # and runs only on pushes to main, so never on a pull request's code.
  coverage-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage-data
          path: backend
      - uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: backend
          ACTIVITY: save_coverage_data_files
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 75

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Keep in step with the pnpm pinned in docker/Dockerfile.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Builds the documentation site with the same strict command the deploy workflow uses, so a
  # broken link or nav entry fails the pull request instead of the deploy. The docs toolchain
  # (docs/pyproject.toml) is separate from the backend's and the app image never sees it.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: docs/uv.lock
      - run: uv sync --locked --project docs
      - run: uv run --project docs mkdocs build --strict
