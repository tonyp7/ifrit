server {
    listen 80;
    listen [::]:80;
    server_name ifrit.mydomain.com;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot -w /var/www/certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ifrit.mydomain.com;

    ssl_certificate     /etc/letsencrypt/live/ifrit.mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ifrit.mydomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_ifrit:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Must stay above MAX_UPLOAD_BYTES (10 MiB by default) plus multipart overhead, or
    # uploads are refused here before they reach the application.
    client_max_body_size 20m;

    location = /pgadmin4 {
        return 301 /pgadmin4/;
    }

    location /pgadmin4/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 300s;
        # A location that sets its own add_header does not inherit the server-level ones,
        # so HSTS has to be repeated here.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Everything else -> ifrit app container (static SPA + /api/)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
