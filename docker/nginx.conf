# Minimal nginx config for the combined app container. Replaces Debian's default
# nginx.conf entirely (rather than dropping a site file alongside it) so the whole
# setup is visible in one place.
#
# Two jobs: serve the built SPA as static files, and reverse-proxy /api/* to
# uvicorn, which is only ever reachable from inside this same container
# (127.0.0.1:8000 — see docker/entrypoint.sh).

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    gzip          on;
    gzip_types    text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # A couple of low-risk defaults. TLS termination and anything beyond this
        # (rate limiting, a stricter CSP, etc.) is assumed to happen upstream of
        # this container (e.g. a load balancer) — see docker-compose.yml and
        # .env.example's COOKIE_SECURE note.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Client-side routing (React Router) — any path that isn't a real static
        # file falls back to index.html instead of a raw 404.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
